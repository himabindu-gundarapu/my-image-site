<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual Image Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300">

  <!-- Header / Navigation -->
  <header class="max-w-6xl mx-auto px-4 py-6 flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-tight">Gallery</h1>
    <div class="flex items-center gap-3">
      <button id="themeToggle" class="p-2 rounded-lg bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition">
        <span id="themeIcon">🌙</span>
      </button>
      <button id="shareBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition flex items-center gap-2">
        <span>Share Link</span>
      </button>
    </div>
  </header>

  <!-- Main Content: Dual Image Grid -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
      
      <!-- Image Container 1 -->
      <div class="group relative rounded-2xl overflow-hidden bg-white dark:bg-slate-800 shadow-xl border border-slate-200 dark:border-slate-700 transition transform hover:-translate-y-1">
        <div class="aspect-w-16 aspect-h-12 overflow-hidden">
          <img 
            id="img1" 
            src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80" 
            alt="First Image" 
            class="w-full h-80 object-cover group-hover:scale-105 transition duration-500 cursor-pointer"
            onclick="openLightbox(this.src)"
          >
        </div>
        <div class="p-4 flex justify-between items-center">
          <span class="font-semibold text-sm text-slate-500 dark:text-slate-400">Image 01</span>
          <button onclick="openLightbox(document.getElementById('img1').src)" class="text-xs bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 px-3 py-1.5 rounded-md transition">Expand</button>
        </div>
      </div>

      <!-- Image Container 2 -->
      <div class="group relative rounded-2xl overflow-hidden bg-white dark:bg-slate-800 shadow-xl border border-slate-200 dark:border-slate-700 transition transform hover:-translate-y-1">
        <div class="aspect-w-16 aspect-h-12 overflow-hidden">
          <img 
            id="img2" 
            src="https://images.unsplash.com/photo-1511884642898-4c92249e20b6?auto=format&fit=crop&w=1200&q=80" 
            alt="Second Image" 
            class="w-full h-80 object-cover group-hover:scale-105 transition duration-500 cursor-pointer"
            onclick="openLightbox(this.src)"
          >
        </div>
        <div class="p-4 flex justify-between items-center">
          <span class="font-semibold text-sm text-slate-500 dark:text-slate-400">Image 02</span>
          <button onclick="openLightbox(document.getElementById('img2').src)" class="text-xs bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 px-3 py-1.5 rounded-md transition">Expand</button>
        </div>
      </div>

    </div>
  </main>

  <!-- Lightbox Modal for Enlarged Preview -->
  <div id="lightbox" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="closeLightbox()">
    <div class="relative max-w-4xl w-full">
      <img id="lightboxImg" src="" alt="Enlarged preview" class="max-h-[85vh] w-auto mx-auto rounded-lg shadow-2xl">
      <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white text-2xl bg-black/50 hover:bg-black/80 rounded-full w-10 h-10 flex items-center justify-center">&times;</button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-4 py-2.5 rounded-lg shadow-xl text-sm font-medium transition opacity-0 pointer-events-none transform translate-y-2">
    Link copied to clipboard!
  </div>

  <script>
    // Light/Dark Theme Toggle
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      themeIcon.textContent = isDark ? '☀️' : '🌙';
    });

    // Share Button Functionality
    const shareBtn = document.getElementById('shareBtn');
    const toast = document.getElementById('toast');

    shareBtn.addEventListener('click', async () => {
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Dual Image Showcase',
            url: window.location.href
          });
        } catch (err) {
          copyToClipboard();
        }
      } else {
        copyToClipboard();
      }
    });

    function copyToClipboard() {
      navigator.clipboard.writeText(window.location.href);
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
      }, 3000);
    }

    // Lightbox Modal logic
    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
    }
  </script>
</body>
</html>
